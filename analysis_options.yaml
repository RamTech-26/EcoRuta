# Configuración del analizador de EcoRuta.
# Reglas acordadas según el apunte "Código limpio en Dart".
# Se revisa con: flutter analyze

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Del apunte de Código limpio
    prefer_const_constructors: true      # avisa cuando falta un const
    prefer_single_quotes: true           # comillas simples en los textos
    directives_ordering: true            # imports ordenados: dart:, package:, propios
    always_declare_return_types: true    # toda función declara qué devuelve

    # Del apunte de Future y async/await
    unawaited_futures: true              # avisa si falta un await

    # Solo lanzar Exception o Error, nunca un String
    only_throw_errors: true